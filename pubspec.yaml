name: portfolio
description: A new Flutter application.

publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  font_awesome_flutter: ^10.8.0
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.2.0+3
  flutter_markdown: ^0.7.6+2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - resources/images/
    - resources/images/zpr/
    - resources/images/fitable/
    - resources/images/deskable/
    - resources/images/richable/
    - resources/images/langdeck/
