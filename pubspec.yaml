name: portfolio
description: A new Flutter application.

publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.8.0
  url_launcher: ^6.3.1
  another_flushbar: ^1.12.30
  auto_size_text: ^3.0.0
  animated_text_kit: ^4.2.2
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.2.0+3
  flutter_markdown: ^0.7.6+2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - resources/
    - resources/images/
    - resources/images/zpr/
    - resources/images/fitable/
    - resources/images/authentication/
    - resources/images/deskable/
    - resources/images/richable/
